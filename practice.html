<section>
<h2>الأسبوع 1: المكتب وتفويضه</h2>
<ol>
<li><p>جهة لها ثلاث شركات تابعة، كل منها تموّل تجاربها. أول قرار صعب متوقع للمكتب: إيقاف تجربة تملكها أكبر شركة تابعة. أي خط ارتباط إداري يجعل هذا القرار ممكنًا؟</p><ul><li><b>أ.</b> المدير العام لأكبر شركة تابعة، إذ تجري أغلب التجارب في شركته اليوم</li><li><b>ب.</b> الرئيس التنفيذي للمجموعة، مع لجنة محفظة يحضرها المديرون العامون</li><li><b>ج.</b> رئيس تقنية المعلومات، فالتجارب كلها تعمل على أنظمته</li><li><b>د.</b> رئيس المراجعة الداخلية، ضمانًا لاستقلال المكتب عن الشركات</li></ul></li>
<li><p>في شركة تأمين افتراضية، وكيل لفرز المطالبات البسيطة جُرّب مرتين: الأولى على 30 مطالبة، والثانية على 30 مطالبة أخرى بعد تعديل التعليمات. نجح 21 ثم 26. ما الذي يمنعك من القول إن التعديل حسّن الوكيل؟</p><ul><li><b>أ.</b> أن ثلاثين مطالبة عدد صغير لا يكفي لأي حكم</li><li><b>ب.</b> أن تكلفة التشغيل الثاني لم تُحسب بعد</li><li><b>ج.</b> أن الوكيل بلا مالك مسمّى في وحدة المطالبات يقرر استمراره بعد التجربة</li><li><b>د.</b> أن التشغيلين على مطالبات مختلفة، فالفرق قد يأتي من المهام</li></ul></li>
<li><p>تكتب مجموعة فنادق افتراضية تفويضًا لمكتبها الجديد للذكاء الاصطناعي. مسودة التفويض تقول إن المكتب «مسؤول عن كل نتائج الذكاء الاصطناعي في الفنادق». ما التعديل الذي يجعل التفويض قابلًا للعمل؟</p><ul><li><b>أ.</b> أن يضاف إلى المكتب فريق تشغيل في كل فندق ليحقق النتائج بنفسه</li><li><b>ب.</b> أن تبقى النتائج عند مديري الفنادق، ويملك المكتب الطريقة والبوابات والسياسة</li><li><b>ج.</b> أن تُنقل المسؤولية عن النتائج إلى رئيس التقنية بصفته مشغّل الأنظمة</li><li><b>د.</b> أن يُحذف ذكر النتائج من التفويض ويُكتفى بعدد المشروعات المطلقة</li></ul></li>
<li><p>خط الارتباط الإداري لمكتب الذكاء الاصطناعي يحدد إلى من يرفع المكتب قراراته، ويؤثر في قدرته على إيقاف حالة يملكها مدير أعلى منه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>إذا شُغّل الوكيل في المختبر ببديل مكتوب بسيناريو لا بنموذج، فأرقامه تقول كيف يتصرف تعريف الوكيل وضوابطه، لا كيف يتصرف نموذج حقيقي.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>خطة المكتب في هذا البرنامج تُكتب في الأسبوع العاشر، بعد اكتمال كل الموضوعات.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 2: نموذج التشغيل وقراءة التشغيلين</h2>
<ol>
<li><p>تفويض مكتب الذكاء الاصطناعي في شركة تأمين افتراضية: «يضع المكتب طريقة المحفظة، ويعتمد الأدوات، ويحدد الحد الأدنى للتقييم، ويُقاس بصافي القيمة». بعد ستة أشهر يُسأل المكتب عن خسارة سببها نموذج تسعير قبلت إدارة الاكتتاب مخاطره. ما الذي كان سيحميه؟</p><ul><li><b>أ.</b> سطر يجعل المكتب يعتمد كل نماذج التسعير قبل إطلاقها</li><li><b>ب.</b> سطر يقيس المكتب بعدد النماذج المراجعة لا بالقيمة</li><li><b>ج.</b> سطر «لا يقرر» يبقي قبول المخاطر عند مالك العمل</li><li><b>د.</b> سطر يجعل المكتب يرتبط بالمراجعة الداخلية مباشرة</li></ul></li>
<li><p>جامعة افتراضية لها ست كليات مستقلة الموازنة. في الجامعة كلها أربعة مختصين في تعلم الآلة، وكلية واحدة فقط لها مالك بيانات وأنظمة مقيسة. الأنظمة عالية المخاطر (القبول والمنح) مركزية. أي نموذج تقترحه للسنة الأولى؟</p><ul><li><b>أ.</b> اتحادي: لكل كلية فريقها ومعاييرها، ومجلس تنسيق خفيف</li><li><b>ب.</b> محور يملك المعيار والمنصة ويبني، وطرف واحد في الكلية الجاهزة</li><li><b>ج.</b> مركزي كامل: المكتب يبني كل الحالات في الكليات الست ويقرر تمويلها وحده</li><li><b>د.</b> لا نموذج قبل أن تصل الكليات الست إلى النضج نفسه</li></ul></li>
<li><p>وكيل لطلبات استرداد رسوم في شركة اتصالات افتراضية فشل في 9 من 30 مهمة: 5 حسب فيها الرسم يدويًا فأخطأ المبلغ (مال دُفع زيادةً)، و3 دار فيها في حلقة حتى نفدت خطواته، و1 نفّذ فيها طلب العميل. ماذا تجرّب أولًا؟</p><ul><li><b>أ.</b> أداة يحسب بها البرنامج الرسم، ثم تشغيل المهام الثلاثين نفسها</li><li><b>ب.</b> رفع حد الخطوات لكل مهمة من 6 إلى 20</li><li><b>ج.</b> إعادة كتابة التعليمات كلها، وإضافة أداتين وضابطين، ثم التشغيل مرة واحدة</li><li><b>د.</b> تشغيل ثلاثين مهمة جديدة أسهل لقياس التحسن</li></ul></li>
<li><p>مجموعة مصرفية افتراضية: أربع شركات تابعة ناضجة، لكل منها فريق بيانات من عشرين مختصًا ومجلس إدارة مستقل، ومنصة بيانات مشتركة تعمل منذ سنوات. أي نموذج تشغيل أقرب إلى حالها؟</p><ul><li><b>أ.</b> مركزي: مكتب واحد يبني لكل الشركات الأربع ويقرر تمويل حالاتها كلها</li><li><b>ب.</b> محور يبني كل شيء، وطرف واحد في الشركة الأنضج</li><li><b>ج.</b> لا نموذج حتى تتفق الشركات الأربع على معيار واحد</li><li><b>د.</b> اتحادي: كل شركة تبني وتموّل، ومجلس تنسيق يضع المعيار المشترك</li></ul></li>
<li><p>وكيل لخدمة العملاء في شركة اتصالات افتراضية جُرّب بنموذجين على المهام الأربعين نفسها. الأول كلّف 2.00 ريال ونجح في 20 مهمة، والثاني كلّف 3.00 ريالات ونجح في 36. أيهما أقل تكلفة لكل نتيجة ناجحة؟</p><ul><li><b>أ.</b> الأول، فتكلفة تشغيله الكلية أقل بريال كامل</li><li><b>ب.</b> متساويان، فالفرق في التكلفة يقابله فرق في النجاح</li><li><b>ج.</b> الثاني: نحو 0.083 ريال لكل نتيجة مقابل 0.100 للأول</li><li><b>د.</b> لا يمكن الحكم من التكلفة الكلية وحدها</li></ul></li>
<li><p>فريق في شركة تأمين افتراضية غيّر تعليمات وكيله وأضاف له أداة ورفع حد خطواته، ثم شغّله على مجموعة مهام جديدة، فارتفع النجاح من 60% إلى 85%. ماذا تقول مذكرة التقييم؟</p><ul><li><b>أ.</b> التحسن جاء من الأداة الجديدة، فهي أكبر التغييرات الثلاثة أثرًا</li><li><b>ب.</b> الوكيل جاهز للتشغيل بنسبة 85%</li><li><b>ج.</b> التحسن جاء من رفع حد الخطوات</li><li><b>د.</b> لا يُعرف مصدر التحسن: ثلاثة تغييرات ومهام مختلفة</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 3: صلاحيات القرار وخارطة الطريق</h2>
<ol>
<li><p>وكيل لحجز مواعيد الصيانة في شركة مرافق افتراضية: التشغيل الأول نجح في 14 من 25 مهمة، والثاني بعد إضافة ضابط واحد نجح في 21 من المهام نفسها وبالميزانية نفسها. لم يُشغَّل الوكيل بعد إلا على هذه المهام الخمس والعشرين. ما أدق جملة للمذكرة؟</p><ul><li><b>أ.</b> الوكيل جاهز للتشغيل الفعلي بنسبة نجاح 84%</li><li><b>ب.</b> لا يمكن معرفة سبب التحسن بين التشغيلين</li><li><b>ج.</b> النتيجة لا تُعتمد، فالمهام قليلة</li><li><b>د.</b> الضابط رفع النجاح من 14 إلى 21 على هذه المهام، والتعميم يحتاج إلى مهام من الواقع</li></ul></li>
<li><p>في مجموعة مرافق افتراضية، نموذج يقترح إيقاف خدمة المياه عن الوحدات المتأخرة في الدفع. البيانات واضحة (مبلغ وتاريخ)، لكن الإيقاف الخاطئ يمس أسرة في منزلها. أي سطر يصلح لجدول الصلاحيات؟</p><ul><li><b>أ.</b> موظف التحصيل يقرر كل إيقاف، والنموذج يقترح ويعرض سببه</li><li><b>ب.</b> النموذج يقرر الإيقاف وحده، فالبيانات واضحة ولا غموض فيها</li><li><b>ج.</b> لجنة المحفظة تقرر كل إيقاف بعد اجتماعها الشهري</li><li><b>د.</b> مكتب الذكاء الاصطناعي يقرر، فهو يملك النموذج</li></ul></li>
<li><p>ملف نضج لشركة نقل افتراضية: القدرات البشرية 1 بالدليل (لا مهندس تعلم آلة)، والبيانات 3. الخارطة تضع «نموذج تسعير ديناميكي يبنيه فريق داخلي» في الشهر 6، و«توظيف الفريق» في الشهر 14. ما أول تعديل؟</p><ul><li><b>أ.</b> تقديم منصة البيانات إلى الشهر 3 قبل النموذج</li><li><b>ب.</b> حذف نموذج التسعير من الخارطة كلها</li><li><b>ج.</b> تقديم التوظيف، ونقل النموذج إلى ما بعد اكتمال الفريق</li><li><b>د.</b> رفع درجة القدرات البشرية إلى 2، فالتوظيف مخطط في الشهر 14 ومموّل</li></ul></li>
<li><p>ملف نضج لهيئة افتراضية: البيانات قُيّمت 3 من 4 في استبيان المديرين، لكن الأدلة تقول إن مجموعتين فقط من سبع لهما مالك وتصنيف. خارطة الطريق المقترحة تضع ثلاث حالات تعتمد على البيانات في الأفق الأول. ما أول تعديل؟</p><ul><li><b>أ.</b> تقديم ملكية البيانات وتصنيفها إلى الأفق الأول، وتأخير الحالات التي تعتمد عليها</li><li><b>ب.</b> إبقاء الحالات في الأفق الأول، فالاستبيان يقول إن البيانات جيدة</li><li><b>ج.</b> حذف الحالات الثلاث من الخارطة حتى يرتفع تقييم البيانات إلى 4</li><li><b>د.</b> إضافة حالات أخرى إلى الأفق الأول لتعويض أي تأخير محتمل</li></ul></li>
<li><p>في خارطة الطريق، يجوز أن تنطلق حالة قبل الممكن الذي تعتمد عليه إذا كان مجلس الإدارة يريدها في السنة الأولى.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>هيئة افتراضية تريد نموذجًا يقترح ترتيب طلبات الدعم الاجتماعي للمراجعة. البيانات تحتمل أكثر من قراءة، والقرار يمس دخل أسر. أين يقع على محوري الغموض والمخاطر، وما دور النموذج؟</p><ul><li><b>أ.</b> غموض منخفض ومخاطر منخفضة: يقرر النموذج والإنسان يراجع عينة</li><li><b>ب.</b> غموض عالٍ ومخاطر عالية: الإنسان يقود ويقرر، والنموذج يساعد</li><li><b>ج.</b> غموض منخفض ومخاطر عالية: يقرر النموذج بعد موافقة شهرية</li><li><b>د.</b> غموض عالٍ ومخاطر منخفضة: يقرر النموذج ويتعلم من الأخطاء</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 4: البوابات والموازنة</h2>
<ol>
<li><p>جدول صلاحيات في شركة تأمين افتراضية. أي سطر يخالف قاعدة الفصل بين المهام؟</p><ul><li><b>أ.</b> تمويل حالة جديدة: تقرر لجنة المحفظة، وتُستشار المخاطر</li><li><b>ب.</b> تمديد حالة بلغت معيار إيقافها: يقرر مالك الحالة وحده</li><li><b>ج.</b> مراجعة الالتزام بسياسة الأدوات: تقرر المراجعة الداخلية</li><li><b>د.</b> اعتماد أداة طلبتها المالية: يقرر المكتب، ويُستشار الأمن</li></ul></li>
<li><p>حالة في شركة اتصالات افتراضية: معيار الإيقاف المكتوب قبل التجربة «أقل من 80% تصنيفًا صحيحًا بعد ربعين». النتيجة بعد ربعين: 68%. المالك يطلب ربعًا ثالثًا لأن الفريق «تعلّم كثيرًا». ما القرار؟</p><ul><li><b>أ.</b> تمديد ربع ثالث، فالمالك أدرى بحالته وبما تعلّمه فريقه</li><li><b>ب.</b> خفض المعيار إلى 65%، فالحالة قريبة منه</li><li><b>ج.</b> تأجيل القرار إلى اجتماع اللجنة القادم</li><li><b>د.</b> إيقاف الحالة، وتوثيق ما تعلّمه الفريق لحالة قادمة</li></ul></li>
<li><p>خارطة لهيئة افتراضية فوق سقف السنة الأولى بـ 300 ألف. منصة البيانات (بناء 1.2 مليون) تعتمد عليها ثلاث حالات في السنة الثانية. أداة لتلخيص المحاضر (بناء 350 ألفًا) لا يعتمد عليها شيء ولا بند لها في الحسابات بعد. ما التغيير الأنسب؟</p><ul><li><b>أ.</b> تأجيل أداة التلخيص إلى أن يُعرف بندها في الحسابات</li><li><b>ب.</b> تأخير منصة البيانات ستة أشهر، فهي أكبر بند في السنة الأولى</li><li><b>ج.</b> خفض كل بنود السنة الأولى بنسبة 5%</li><li><b>د.</b> نقل التجاوز كله إلى السنة الثانية</li></ul></li>
<li><p>خارطة طريق لشركة نقل افتراضية: البناء 4,000 ثم 2,500 ثم 800 ألف ريال، والتشغيل 600 ثم 2,000 ثم 3,400. السقف ثابت 5,000 كل سنة. ما الذي يقوله ذلك لموازنة السنة الرابعة؟</p><ul><li><b>أ.</b> يبقى 1,600 للبناء الجديد تقريبًا قبل أي إيقاف</li><li><b>ب.</b> يبقى 4,200 للبناء الجديد، فالبناء نزل إلى 800</li><li><b>ج.</b> لا أثر للتشغيل، فهو يُدفع من موازنة تقنية المعلومات</li><li><b>د.</b> يكفي رفع السقف في السنة الرابعة بقدر التضخم</li></ul></li>
<li><p>خارطة لمجموعة فنادق افتراضية فوق سقف السنة الأولى بـ 120 ألفًا. أحد المقترحات: تأخير إيقاف نظام الحجز القديم (رخصته 240 ألفًا في السنة) ستة أشهر لتوفير كلفة الإيقاف (90 ألفًا) هذه السنة. ما الحكم؟</p><ul><li><b>أ.</b> مقبول، فكلفة الإيقاف تخرج من السنة الأولى</li><li><b>ب.</b> مقبول إذا وافق المورد على تخفيض الرخصة</li><li><b>ج.</b> مرفوض: ستة أشهر من الرخصة 120 ألفًا، أكثر مما يوفره</li><li><b>د.</b> مرفوض فقط إذا تبيّن أن النظام القديم غير آمن أو لا يدعمه المورد</li></ul></li>
<li><p>في مجموعة مطاعم افتراضية، تقول ورقة حالة لجدولة الموظفين إن قيمتها 900 ألف ريال سنويًا: 200 ألف خفض في العمل الإضافي، و700 ألف «موظفون لن نحتاج إلى توظيفهم». خطة التوظيف للسنوات الثلاث لا توظيف فيها. كم تقبل اللجنة قيمة قابلة للتتبع؟</p><ul><li><b>أ.</b> 900 ألف، فالورقة موقعة من المالك</li><li><b>ب.</b> 700 ألف، فهو أكبر بند في الورقة</li><li><b>ج.</b> 200 ألف، وهو ما يمس بندًا موجودًا في الحسابات</li><li><b>د.</b> صفر حتى تنتهي التجربة وتُقاس النتائج كاملة في سنة تشغيل</li></ul></li>
<li><p>أي معيار إيقاف يصلح لحالة تصنيف شكاوى في شركة اتصالات افتراضية؟</p><ul><li><b>أ.</b> «الإيقاف إذا قلت الدقة عن 85% على عينة الربع الثاني»</li><li><b>ب.</b> «الإيقاف إذا لم تحقق الحالة النتائج المرجوة منها في وقتها المناسب»</li><li><b>ج.</b> «الإيقاف إذا رأت اللجنة أن الوقت مناسب»</li><li><b>د.</b> «الإيقاف إذا لم يستعملها 80% من الموظفين»</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 5: يوم المحاكاة الأول: لجنة المحفظة</h2>
<ol>
<li><p>حالة في شركة اتصالات افتراضية: الورقة تقول إن القيمة 600 ألف: 150 ألفًا خفض في أتعاب مركز اتصال متعاقد (بند قائم في الحسابات)، و450 ألفًا «وقت المشرفين الذي وُفّر». ماذا تقبل اللجنة قيمةً قابلة للتتبع؟</p><ul><li><b>أ.</b> 600 ألف، فالورقة موقعة من مالك الحالة</li><li><b>ب.</b> 150 ألفًا: الجزء الذي يمس بندًا قائمًا</li><li><b>ج.</b> 450 ألفًا: الوقت أكبر أثرًا من الأتعاب</li><li><b>د.</b> لا شيء حتى تُقاس القيمة كلها في سنة تشغيل كاملة</li></ul></li>
<li><p>مستشفى افتراضي: نموذج لجدولة غرف العمليات تكلفته السنوية 400 ألف، ويضيف 2,000 عملية ناجحة الجدولة في السنة، فالتكلفة 200 ريال لكل عملية. الجدولة اليدوية اليوم تكلف 150 ريالًا للعملية. الورقة تقول إن القيمة «ساعات جراحين وُفّرت». ماذا تقول اللجنة؟</p><ul><li><b>أ.</b> تموَّل، فساعات الجراحين أثمن بكثير من كلفة النموذج السنوية</li><li><b>ب.</b> تُوقف فورًا، فقد بلغت معيار إيقافها</li><li><b>ج.</b> تُعاد لمالكها: أغلى من خط الأساس، وقيمتها لم تُربط ببند</li><li><b>د.</b> تموَّل تجربة سنة، ثم يُسأل عن البند بعدها</li></ul></li>
<li><p>في لجنة شركة طيران افتراضية، رئيس العمليات عضو في اللجنة ومالك حالة «جدولة الأطقم». حالته في المرتبة السادسة، والسقف يتسع لخمس. يقترح أن تصوّت اللجنة على تقديمها إلى المرتبة الخامسة.</p><ul><li><b>أ.</b> يُجري التصويت، فكل عضو له صوت واحد</li><li><b>ب.</b> يستبعد الحالة من الترتيب كله، فمالكها عضو في اللجنة نفسها</li><li><b>ج.</b> يرفع السقف قليلًا لتتسع الحالة السادسة</li><li><b>د.</b> يخرج المالك من القرار في حالته، وتقرر اللجنة بسبب مكتوب</li></ul></li>
<li><p>مركز اتصال افتراضي: وكيل يجيب عن الأسئلة بتكلفة سنوية 360 ألف ريال، وينجح في 40,000 محادثة في السنة. الإجابة اليوم يقدمها موظف بكلفة 7 ريالات للمحادثة، في بند رواتب قائم. ماذا تقول اللجنة؟</p><ul><li><b>أ.</b> الوكيل أرخص، فهو يعمل على مدار الساعة دون رواتب ولا عمل إضافي</li><li><b>ب.</b> لا مقارنة ممكنة بين وكيل وموظف</li><li><b>ج.</b> تكفي نسبة النجاح دون حساب التكلفة</li><li><b>د.</b> الوكيل أغلى: 9 ريالات للمحادثة مقابل 7 اليوم</li></ul></li>
<li><p>حين يخفض مجلس الإدارة سقف المحفظة في أثناء اجتماع اللجنة، تُعاد الحسبة بالسقف الجديد وتُخرج حالة بسبب مكتوب، بدل تخفيض كل حالة بالنسبة نفسها.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 6: الأدوات المعتمدة وقواعد البيانات</h2>
<ol>
<li><p>في لجنة محفظة لمجموعة فنادق افتراضية، بعد القرار الأول: يقبل المدير المالي أن خفض العمل الإضافي في الاستقبال بند قائم، فترتفع القيمة المقبولة لحالة كانت أُعيدت لمالكها. ماذا تفعل اللجنة؟</p><ul><li><b>أ.</b> تُبقي القرار الأول كما هو، فقد اتُّخذ وسُجّل في محضر الاجتماع</li><li><b>ب.</b> تعيد حساب الحالة وحدها، وتغيّر ما يلزم بسبب مكتوب</li><li><b>ج.</b> تعيد النقاش في الحالات كلها من أوله</li><li><b>د.</b> ترفع السقف لتموّل الحالة فوق الحالات الخمس</li></ul></li>
<li><p>شركة نقل خاصة افتراضية اعتمدت عبارة المبادئ ومدّتها إلى أدواتها. مدير الأسطول يريد أن يلخص بمساعد توليدي تشتريه الشركة تقارير حوادث فيها أسماء السائقين، بعد أن يحذف الأسماء بنفسه. ما الجواب؟</p><ul><li><b>أ.</b> مسموح، فالأداة تشتريها الشركة</li><li><b>ب.</b> مسموح بعد حذف الأسماء، فتصير البيانات عامة</li><li><b>ج.</b> غير مسموح حتى يعيد مالك البيانات تصنيفها كتابة</li><li><b>د.</b> غير مسموح أبدًا، فتقارير الحوادث كلها سرية للغاية</li></ul></li>
<li><p>في هيئة افتراضية، موظف الاتصال يطلب استعمال مساعد كتابة عام غير مدرج في القائمة لصياغة منشورات من أخبار الهيئة المنشورة على موقعها. ما الرد الذي يتبع سياسة بفئات وطريق اعتماد؟</p><ul><li><b>أ.</b> تُستعمل أداة معتمدة الآن، ويُطلب اعتماد هذه بالطريق السريع</li><li><b>ب.</b> مسموح، فالأخبار منشورة على موقع الهيئة ولا خطر في إدخالها</li><li><b>ج.</b> غير مسموح، فكل أداة عامة ممنوعة</li><li><b>د.</b> مسموح إذا وافق مدير الاتصال كتابة</li></ul></li>
<li><p>جهة حكومية افتراضية اشترت مساعدًا توليديًا يعمل في مستأجر خاص بها. يريد موظف أن يلخص به محاضر اجتماعات مصنفة «مقيد». ماذا تقول مبادئ الذكاء الاصطناعي التوليدي للجهات الحكومية؟</p><ul><li><b>أ.</b> يجوز، فالمستأجر خاص بالجهة ولا تخرج البيانات منها</li><li><b>ب.</b> يجوز بعد حذف الأسماء من المحاضر</li><li><b>ج.</b> لا يجوز: تُقصر أدوات الذكاء الاصطناعي التوليدي على البيانات المصنفة «عامة»</li><li><b>د.</b> يجوز إذا وافق مدير الإدارة كتابة على التلخيص</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 7: صلاحيات الوكلاء وملكية التقييم</h2>
<ol>
<li><p>مسودة سياسة لشركة خاصة افتراضية اعتمدت عبارة المبادئ. أي جملة فيها تحتاج إلى تعديل؟</p><ul><li><b>أ.</b> «تقتصر أدوات الذكاء الاصطناعي التوليدي على البيانات المصنفة "عامة"، كما في المبادئ»</li><li><b>ب.</b> «تمد الشركة هذه القاعدة إلى أدواتها، وهذه قاعدة الشركة»</li><li><b>ج.</b> «يوجب النظام على الشركات الخاصة ألا تستعمل أي أداة عامة»</li><li><b>د.</b> «يصنّف مالك البيانات مجموعته على المستويات الأربعة»</li></ul></li>
<li><p>وكيل في شركة تأمين افتراضية يكتب ردودًا على شكاوى العملاء. المالك يطلب أن يرسل الوكيل الرد مباشرة إذا كانت الشكوى عن موعد زيارة فقط، وأن تمر الشكاوى عن التعويضات على موظف. ما المصفوفة الأنسب لفعل الإرسال؟</p><ul><li><b>أ.</b> ص3 لكل الشكاوى، بمراجعة عينة يومية</li><li><b>ب.</b> ص2 لكل الشكاوى، والموافِق مالك الوكيل</li><li><b>ج.</b> ص0 لكل الشكاوى، فالرد نص لا مال</li><li><b>د.</b> ص3 لمواعيد الزيارات بحد مكتوب، وص2 للتعويضات بموافقة موظف المطالبات</li></ul></li>
<li><p>وكيل يجيب موظفي هيئة افتراضية عن أسئلة الإجازات بحسب لائحة الموارد البشرية. فريق التقنية بنى الوكيل ويقترح أن يكتب حزمة التقييم بنفسه لأنه يعرف النموذج. من يملكها؟</p><ul><li><b>أ.</b> فريق التقنية، فقد بنى الوكيل ويعرف حدوده وطريقة عمله</li><li><b>ب.</b> إدارة الموارد البشرية، فهي تعرف الإجابة الصحيحة</li><li><b>ج.</b> مكتب الذكاء الاصطناعي، فهو يضع معيار التقييم</li><li><b>د.</b> المراجعة الداخلية، فهي مستقلة عن الجميع</li></ul></li>
<li><p>وكيل في شركة توزيع افتراضية يصدر أوامر شراء حتى 10,000 ريال (ص3). من يصلح موافِقًا على الأوامر فوق الحد؟</p><ul><li><b>أ.</b> مدير المشتريات، وهو مالك الوكيل</li><li><b>ب.</b> مشرف الحسابات الدائنة، وهو خارج ملكية الوكيل</li><li><b>ج.</b> فريق التقنية الذي بنى الوكيل ويعرف حدوده أكثر من غيره</li><li><b>د.</b> الوكيل نفسه بعد قراءة سياسة الشراء</li></ul></li>
<li><p>وكيل يجيب عن أسئلة الموردين في إدارة مشتريات افتراضية. من يملك حزمة تقييمه؟</p><ul><li><b>أ.</b> فريق التقنية الذي بنى الوكيل</li><li><b>ب.</b> مكتب الذكاء الاصطناعي الذي وضع طريقة التقييم</li><li><b>ج.</b> إدارة المشتريات التي تعرف الإجابة الصحيحة</li><li><b>د.</b> المورد الذي يقدّم النموذج</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 8: وكلاء البرمجة والأدوات التي يبنيها الموظفون والموردون</h2>
<ol>
<li><p>سطر في مصفوفة شركة مرافق افتراضية: «وكيل الفواتير، إصدار إشعار خصم للعميل، ص3، الموافِق: مدير الفوترة (مالك الوكيل)، مالك التقييم: فريق التقنية». ما أهم ما ينقصه؟</p><ul><li><b>أ.</b> حد مكتوب لـ ص3، وموافِق غير المالك، ومالك تقييم من العمل</li><li><b>ب.</b> خفض المستوى إلى ص0، فالإشعار نص يُرسل ولا يحرك مالًا بنفسه</li><li><b>ج.</b> رفع المستوى إلى ص4 لتسريع الخصومات</li><li><b>د.</b> كتابة اسم الشخص الموافِق بدل دوره</li></ul></li>
<li><p>في جامعة افتراضية، موظف في شؤون الطلاب بنى بمساعد برمجة أداة على جهازه تقرأ سجل الحضور وترسل إنذارات غياب للطلاب. الأداة تعمل منذ شهرين، ولم يشتكِ أحد. ماذا تقول سياسة فيها قواعد ما يبنيه الموظفون؟</p><ul><li><b>أ.</b> تبقى كما هي، فلم يشتكِ طالب ولا أستاذ في شهرين من الاستعمال اليومي</li><li><b>ب.</b> تُحذف فورًا، ويُحاسب الموظف</li><li><b>ج.</b> تُسجَّل ولها مالك، وتُنقل إلى جهاز الجامعة، وتُراجع حالاتها الحدية</li><li><b>د.</b> يوافق عليها مدير شؤون الطلاب كتابة</li></ul></li>
<li><p>وكيل في شركة تأمين افتراضية يصرف تعويضات صغيرة (ص3 بحد مكتوب). المورد أعلن أن الإصدار الحالي يُستبدل تلقائيًا بعد أسبوع، ولا يسمح بالتثبيت. حزمة التقييم لم تُشغَّل على الإصدار الجديد بعد. ما الذي تفعله السياسة؟</p><ul><li><b>أ.</b> لا شيء؛ الإصدار الأحدث أفضل عادة</li><li><b>ب.</b> يوقف الوكيل نهائيًا ويُبحث عن مورد آخر</li><li><b>ج.</b> يبقى الوكيل على ص3 إذا تعهد المالك بمراقبته</li><li><b>د.</b> ينزل الوكيل إلى ص1 من يوم التبديل حتى تنجح الحزمة على الإصدار الجديد</li></ul></li>
<li><p>محاسب في هيئة افتراضية بنى بمساعد برمجة جدولًا يحسب مستحقات المتقاعدين، ويستعمله زملاؤه منذ أشهر. ما أول ما تطلبه سياسة فيها قواعد ما يبنيه الموظفون؟</p><ul><li><b>أ.</b> تسجيله، ومالك له، ومراجعة من غير كاتبه، واختبار حالاته الحدية</li><li><b>ب.</b> منعه فورًا ومحاسبة المحاسب</li><li><b>ج.</b> تركه ما دام لم يشتكِ أحد</li><li><b>د.</b> نقله إلى فريق التقنية ليعيد بناءه من البداية قبل أن يستعمله أحد</li></ul></li>
<li><p>إذا أعلن مورد النموذج إصدارًا جديدًا يحل محل الحالي، يكفي أن يقرأ فريق التقنية ملاحظات الإصدار قبل التبديل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 9: الإلمام وحماية الخبرة، والإشراف على الحوادث</h2>
<ol>
<li><p>في شركة اتصالات افتراضية، وكيل برمجة معتمد على مستودع تجريبي. مطور يطلب أن يعمل على مستودع نظام الفوترة الحقيقي، وأن ينشر التعديل في الإنتاج «إذا نجحت الاختبارات». ما القاعدة الأقرب إلى حسم الطلب؟</p><ul><li><b>أ.</b> نجاح الاختبارات يكفي للنشر إذا راجع المطور الشيفرة بنفسه</li><li><b>ب.</b> الوكيل معتمد على مستودع بعينه، والنشر في الإنتاج بموافقة لا بنتيجة اختبار</li><li><b>ج.</b> الإصدار الجديد يُشغَّل على حزمة التقييم قبل التبديل</li><li><b>د.</b> كل أداة يبنيها موظف تُسجَّل قبل أن تمس البيانات</li></ul></li>
<li><p>في مستشفى افتراضي، الصيادلة يراجعون جرعات يقترحها نموذج. نسبة رفضهم للاقتراحات نزلت من 6% إلى 0.5% في سنة، ولم تتغير جودة النموذج. أي خطة تعالج ما تقوله هذه النسبة؟</p><ul><li><b>أ.</b> دورة سنوية لكل العاملين عن الذكاء الاصطناعي</li><li><b>ب.</b> رفع صلاحية النموذج، فالصيادلة يوافقون على اقتراحاته كلها تقريبًا منذ سنة</li><li><b>ج.</b> حالات بأخطاء مزروعة في المراجعة، وحساب يدوي دوري لعينة من الجرعات</li><li><b>د.</b> إنذار الصيادلة الذين تقل نسبة رفضهم عن 2%</li></ul></li>
<li><p>في شركة توصيل افتراضية، أداة لتقييم المندوبين بناها موظف أعطت عشرين مندوبًا تقييمًا «ضعيفًا» بسبب خطأ في احتساب أيام العطل، وخُصمت حوافزهم. لم يخرج أي بيان خارج الشركة. ما أول قرار يناسب السلم؟</p><ul><li><b>أ.</b> ح2: إيقاف الأداة، وتعليق الخصم، وإبلاغ مالك العمل ورئيس المكتب</li><li><b>ب.</b> ح1: إبلاغ صاحب الأداة ليصلح الخطأ في التحديث القادم، ثم إعادة الحساب</li><li><b>ج.</b> ح3: إشعار الجهة المختصة خلال 72 ساعة</li><li><b>د.</b> انتظار نهاية الشهر لمعرفة عدد المتأثرين كله</li></ul></li>
<li><p>جهة افتراضية علمت أن قائمة فيها أسماء مستفيدين وأرقام هواتفهم أُرسلت خطأً إلى طرف خارجي، ومن شأن ذلك الإضرار بأصحابها. ما الذي تطلبه اللائحة التنفيذية لنظام حماية البيانات الشخصية؟</p><ul><li><b>أ.</b> إشعار الجهة المختصة بعد اكتمال التحقيق الداخلي، أيًا كانت مدته</li><li><b>ب.</b> إشعار الجهة المختصة خلال مدة لا تتجاوز 72 ساعة من وقت العلم بالحادثة</li><li><b>ج.</b> إشعار أصحاب البيانات وحدهم، دون الجهة المختصة</li><li><b>د.</b> لا إشعار إذا استُعيدت القائمة من الطرف الخارجي في اليوم نفسه</li></ul></li>
<li><p>في حادثة بشركة نقل افتراضية: أداة أعطت تقييمات خاطئة لسائقين (ح2). بعد ساعتين تبيّن أن التقييمات أُرسلت إلى شركة تأمين خارجية لا عقد لها بها. ماذا يتغير؟</p><ul><li><b>أ.</b> ترتفع إلى ح3، ويُسجَّل وقت العلم، ويُقيَّم الإشعار</li><li><b>ب.</b> تبقى ح2، فالخطأ نفسه لم يتغير</li><li><b>ج.</b> تنخفض إلى ح1، فالأداة أُوقفت</li><li><b>د.</b> لا شيء حتى يكتمل التحقيق في سبب الإرسال ومن أمر به</li></ul></li>
<li><p>كيف يُقاس برنامج الإلمام القائم على الأدوار لمن يوافقون على أفعال الوكلاء في جهة افتراضية؟</p><ul><li><b>أ.</b> بنسبة من حضر الدورة</li><li><b>ب.</b> بعينة من موافقاتهم: كم فعلًا خاطئًا رُفض</li><li><b>ج.</b> باستبيان رضا بعد الدورة عن جودة المحتوى والمدرّب</li><li><b>د.</b> بعدد الأدوات التي يستعملونها</li></ul></li>
</ol>
</section>
<section>
<h2>الأسبوع 10: يوم المحاكاة الثاني: الحادثة والجهة المختصة</h2>
<ol>
<li><p>أداة في شركة طيران افتراضية تحسب ساعات راحة الطواقم. الخطأ فيها يقع في كل رحلة تعبر يومين، وهي ثلث الرحلات، وقد يجعل طاقمًا متعبًا يطير. بمصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي، ما مستوى الخطر؟</p><ul><li><b>أ.</b> نادر × كارثي = 4، متوسط</li><li><b>ب.</b> شبه مؤكد × متوسط = 8، مرتفع</li><li><b>ج.</b> شبه مؤكد × كارثي = 12، مرتفع</li><li><b>د.</b> شبه مؤكد × كارثي = 16، كارثي</li></ul></li>
<li><p>جهة افتراضية أرسلت بالخطأ ملفًا فيه أسماء 200 مستفيد إلى بريد خارجي. عرفت أن مستلمًا واحدًا من ثلاثة فتحه وحذفه، ولا تعرف بعد عن الآخرين. أي جملة تصلح للرد على الجهة المختصة؟</p><ul><li><b>أ.</b> «حُذف الملف ولم يطّلع عليه أحد»</li><li><b>ب.</b> «فتحه مستلم واحد وأكد حذفه؛ ولا نعرف بعد حال المستلمَين الآخرين، ونعرفه خلال يومين»</li><li><b>ج.</b> «الخطأ فردي من موظف تمت محاسبته»</li><li><b>د.</b> «نرد بعد اكتمال التحقيق الداخلي»</li></ul></li>
<li><p>بعد حادثة في مستشفى افتراضي (أداة مواعيد أرسلت تذكيرات بأسماء مرضى إلى أرقام خاطئة)، طلب رئيس المجلس إحاطة في صفحة. أي مسودة أقرب إلى ما يحتاج إليه؟</p><ul><li><b>أ.</b> عدد المرضى والأرقام، والإشعار ومالكه، وما تغيّر في تسجيل الأدوات</li><li><b>ب.</b> شرح للخطأ في قاعدة بيانات الأرقام وكيف أُصلح</li><li><b>ج.</b> اسم الموظف المسؤول والإجراء التأديبي المتخذ</li><li><b>د.</b> تأكيد أن الحادثة محدودة، وأن كل شيء تحت السيطرة، وأن لا داعي لقلق المجلس</li></ul></li>
<li><p>في رد على الجهة المختصة عن حادثة في جهة افتراضية، لا يُعرف بعد هل فتح مستلمان من ثلاثة الملف. ما الجملة الصالحة؟</p><ul><li><b>أ.</b> «لم يطّلع أحد على الملف»</li><li><b>ب.</b> «الخطأ فردي من موظف تمت محاسبته»</li><li><b>ج.</b> «نرد على هذا البند حين يكتمل التحقيق الداخلي ونعرف الصورة كلها»</li><li><b>د.</b> «لا نعرف بعد حال المستلمَين؛ نعرفه خلال يومين ونرسله»</li></ul></li>
<li><p>ما الذي يحتاج إليه مجلس إدارة جهة افتراضية في التقرير الدوري عن الذكاء الاصطناعي؟</p><ul><li><b>أ.</b> القيمة في الحسابات، وما أُوقف، والمخاطر المرتفعة، والحوادث وما تغيّر بسببها</li><li><b>ب.</b> عدد المستخدمين الأسبوعيين لكل أداة ونسبة نموهم في كل شركة ووحدة عمل خلال الربع</li><li><b>ج.</b> الشرح التقني لكل نموذج جديد</li><li><b>د.</b> قائمة بأسماء الموردين وعقودهم</li></ul></li>
</ol>
</section>
<section>
<h2>المناقشة الختامية: الدفاع عن خطة المكتب أمام اللجنة</h2>
<ol>
<li><p>خطة مكتب في جهة افتراضية: المحفظة تموّل حالة تنبؤ في السنة الأولى، وخارطة الطريق تضع منصة البيانات التي تعتمد عليها في السنة الثانية، والموازنة لا تذكر تشغيلها. ما أول ما تسأل عنه اللجنة؟</p><ul><li><b>أ.</b> جودة صياغة الخطة وطولها، وملاءمة لغتها وأسلوبها لأعضاء مجلس الإدارة</li><li><b>ب.</b> عدد الحالات الممولة مقارنة بجهات أخرى</li><li><b>ج.</b> اتساق الأرقام: متى تُبنى الحالة، وأين تشغيلها في الموازنة</li><li><b>د.</b> اسم المورد الذي سيبني الحالة</li></ul></li>
<li><p>في المناقشة، تسأل اللجنة: «لو خُفض سقف السنة الأولى 20%، ماذا تغيّر؟». أي إجابة تستحق الدرجة الأعلى؟</p><ul><li><b>أ.</b> «نخفض كل بند في السنة الأولى 20% حتى لا تتضرر حالة دون غيرها، ونبقي الخطة كما هي»</li><li><b>ب.</b> «نطلب من المجلس إعادة السقف»</li><li><b>ج.</b> «نؤجل الخطة سنة»</li><li><b>د.</b> «نؤجل الحالة الأضعف صافيًا ونبقي ما تعتمد عليه الحالات، وهذا رقم السنة»</li></ul></li>
</ol>
</section>

"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الحالة لا تعمل قبل ما تعتمد عليه؛ يُقال للمجلس ما يحصل عليه في السنة الأولى بدلها ومتى يحصل على ما طلب.","misconceptions":["يقدّم رغبة المجلس على التبعية",""],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-mandate-scope","type":"single","prompt":"تكتب مجموعة فنادق افتراضية تفويضًا لمكتبها الجديد للذكاء الاصطناعي. مسودة التفويض تقول إن المكتب «مسؤول عن كل نتائج الذكاء الاصطناعي في الفنادق». ما التعديل الذي يجعل التفويض قابلًا للعمل؟","options":[{"key":"أ","text":"أن يضاف إلى المكتب فريق تشغيل في كل فندق ليحقق النتائج بنفسه"},{"key":"ب","text":"أن تبقى النتائج عند مديري الفنادق، ويملك المكتب الطريقة والبوابات والسياسة"},{"key":"ج","text":"أن تُنقل المسؤولية عن النتائج إلى رئيس التقنية بصفته مشغّل الأنظمة"},{"key":"د","text":"أن يُحذف ذكر النتائج من التفويض ويُكتفى بعدد المشروعات المطلقة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المكتب لا يملك أدوات تحقيق النتيجة في كل فندق؛ يملك طريقة المحفظة والبوابات والسياسة، ويبقى مالك العمل مسؤولًا عن نتيجته.","misconceptions":["يحل المكتب محل وحدات العمل فيكرر التشغيل ولا يحل مشكلة المساءلة","","يربط النتيجة بمن يشغّل النظام لا بمن يملك العمل","يستبدل القيمة بمؤشر تبني لا يقيس أثرًا"],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-operating-model-federated","type":"single","prompt":"مجموعة مصرفية افتراضية: أربع شركات تابعة ناضجة، لكل منها فريق بيانات من عشرين مختصًا ومجلس إدارة مستقل، ومنصة بيانات مشتركة تعمل منذ سنوات. أي نموذج تشغيل أقرب إلى حالها؟","options":[{"key":"أ","text":"مركزي: مكتب واحد يبني لكل الشركات الأربع ويقرر تمويل حالاتها كلها"},{"key":"ب","text":"محور يبني كل شيء، وطرف واحد في الشركة الأنضج"},{"key":"ج","text":"لا نموذج حتى تتفق الشركات الأربع على معيار واحد"},{"key":"د","text":"اتحادي: كل شركة تبني وتموّل، ومجلس تنسيق يضع المعيار المشترك"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الشركات ناضجة ومستقلة ولها فرقها ومنصة مشتركة: الاتحادي يناسبها، والمعيار المشترك عند مجلس تنسيق.","misconceptions":["يتجاهل استقلال الشركات وفرقها","يناسب جهة نادرة المواهب لا جهة لكل شركة فيها فريق","يؤجل القرار بانتظار اتفاق يصنعه النموذج نفسه",""],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-decision-rights-matrix","type":"single","prompt":"هيئة افتراضية تريد نموذجًا يقترح ترتيب طلبات الدعم الاجتماعي للمراجعة. البيانات تحتمل أكثر من قراءة، والقرار يمس دخل أسر. أين يقع على محوري الغموض والمخاطر، وما دور النموذج؟","options":[{"key":"أ","text":"غموض منخفض ومخاطر منخفضة: يقرر النموذج والإنسان يراجع عينة"},{"key":"ب","text":"غموض عالٍ ومخاطر عالية: الإنسان يقود ويقرر، والنموذج يساعد"},{"key":"ج","text":"غموض منخفض ومخاطر عالية: يقرر النموذج بعد موافقة شهرية"},{"key":"د","text":"غموض عالٍ ومخاطر منخفضة: يقرر النموذج ويتعلم من الأخطاء"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"البيانات تحتمل أكثر من قراءة (غموض عالٍ) والقرار يمس دخل أسر (مخاطر عالية): يبقى الإنسان قائدًا للقرار.","misconceptions":["يقلل الغموض والمخاطر معًا","","يعطي النموذج قرارًا يمس أسرًا بموافقة لا تراه في كل مرة","يقلل المخاطر وهي دخل أسر"],"lo":["LO2"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-reporting-line","type":"tf","prompt":"خط الارتباط الإداري لمكتب الذكاء الاصطناعي يحدد إلى من يرفع المكتب قراراته، ويؤثر في قدرته على إيقاف حالة يملكها مدير أعلى منه.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المكتب الذي يرفع إلى من هو أدنى من مالكي الحالات يصعب عليه أن يوقف حالاتهم؛ لذلك يُكتب خط الارتباط في التفويض.","misconceptions":["","يظن أن خط الارتباط شكل تنظيمي بلا أثر في القرار"],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-gate-traceable-value","type":"single","prompt":"في مجموعة مطاعم افتراضية، تقول ورقة حالة لجدولة الموظفين إن قيمتها 900 ألف ريال سنويًا: 200 ألف خفض في العمل الإضافي، و700 ألف «موظفون لن نحتاج إلى توظيفهم». خطة التوظيف للسنوات الثلاث لا توظيف فيها. كم تقبل اللجنة قيمة قابلة للتتبع؟","options":[{"key":"أ","text":"900 ألف، فالورقة موقعة من المالك"},{"key":"ب","text":"700 ألف، فهو أكبر بند في الورقة"},{"key":"ج","text":"200 ألف، وهو ما يمس بندًا موجودًا في الحسابات"},{"key":"د","text":"صفر حتى تنتهي التجربة وتُقاس النتائج كاملة في سنة تشغيل"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"القيمة تُقبل حين تمس بندًا في الحسابات يقبله المدير المالي؛ توظيف غير مخطط لا يُوفَّر.","misconceptions":["يقبل الورقة لأنها موقعة دون فحص بنودها","يأخذ البند الأكبر وهو الذي لا يوجد في الحسابات","","يرفض الجزء القابل للتتبع مع غير القابل"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-kill-criterion-written","type":"single","prompt":"أي معيار إيقاف يصلح لحالة تصنيف شكاوى في شركة اتصالات افتراضية؟","options":[{"key":"أ","text":"«الإيقاف إذا قلت الدقة عن 85% على عينة الربع الثاني»"},{"key":"ب","text":"«الإيقاف إذا لم تحقق الحالة النتائج المرجوة منها في وقتها المناسب»"},{"key":"ج","text":"«الإيقاف إذا رأت اللجنة أن الوقت مناسب»"},{"key":"د","text":"«الإيقاف إذا لم يستعملها 80% من الموظفين»"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المعيار الصالح رقم وعينة وموعد، يُكتب قبل التمويل ويقيسه غير المالك.","misconceptions":["","معيار لا يُقاس، فلا يُبلغ أبدًا","يترك القرار للمزاج لا للمعيار","يقيس الاستخدام، والاستخدام ليس نتيجة"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-cpso-baseline","type":"single","prompt":"مركز اتصال افتراضي: وكيل يجيب عن الأسئلة بتكلفة سنوية 360 ألف ريال، وينجح في 40,000 محادثة في السنة. الإجابة اليوم يقدمها موظف بكلفة 7 ريالات للمحادثة، في بند رواتب قائم. ماذا تقول اللجنة؟","options":[{"key":"أ","text":"الوكيل أرخص، فهو يعمل على مدار الساعة دون رواتب ولا عمل إضافي"},{"key":"ب","text":"لا مقارنة ممكنة بين وكيل وموظف"},{"ke
